<div class="login-view">
  <form class="panel form login-panel" (submit)="submit($event)">
    <h1>Iniciar sesión</h1>
    <p class="hint">Sistema de inventario · Cibercafé y Papelería</p>
    <label for="loginEmail">Correo</label>
    <input
      id="loginEmail"
      name="email"
      type="email"
      autocomplete="username"
      required
      [(ngModel)]="email"
    />
    <label for="loginPassword">Contraseña</label>
    <input
      id="loginPassword"
      name="password"
      type="password"
      autocomplete="current-password"
      required
      [(ngModel)]="password"
    />
    @if (auth.error()) {
      <p class="hint err" role="alert" aria-live="polite">{{ auth.error() }}</p>
    }
    <div class="login-actions">
      <button class="btn primary" type="submit" [disabled]="auth.loading()">
        {{ auth.loading() ? 'Ingresando…' : 'Entrar' }}
      </button>
    </div>
    <div class="login-divider" aria-hidden="true"><span>o</span></div>
    <button
      class="btn google-btn"
      type="button"
      [disabled]="auth.loading()"
      (click)="signInWithGoogle()"
    >
      <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="#EA4335" d="M12 10.2v3.9h5.4c-.2 1.2-.9 2.2-2 2.9l3.2 2.5c1.9-1.7 3-4.2 3-7.2 0-.7-.1-1.4-.2-2.1H12z"/>
        <path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 .9-3.4.9-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6C4.7 19.8 8.1 22 12 22z"/>
        <path fill="#4A90E2" d="M6.4 13.9c-.2-.6-.3-1.2-.3-1.9s.1-1.3.3-1.9V7.5H3.1A10 10 0 0 0 2 12c0 1.6.4 3.1 1.1 4.5l3.3-2.6z"/>
        <path fill="#FBBC05" d="M12 6c1.5 0 2.8.5 3.9 1.5l2.9-2.9C17 3 14.7 2 12 2 8.1 2 4.7 4.2 3.1 7.5l3.3 2.6c.8-2.3 3-4.1 5.6-4.1z"/>
      </svg>
      Iniciar sesión con Google
    </button>
  </form>
</div>
